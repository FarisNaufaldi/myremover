<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>MyRemover · Background Remover</title>

    <script>
      (function () {
        try {
          var t = localStorage.getItem("myremover-theme") || localStorage.getItem("bg-remover-theme");
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            var fav = document.getElementById("favicon");
            if (fav) fav.setAttribute("href", "/favicon-light.svg");
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>

    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #e7e7ea;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        transition: opacity 450ms ease-out, visibility 450ms ease-out;
      }
      html[data-theme="light"] #splash-screen {
        background: #f4f4f4;
        color: #0a0a0a;
      }
      #splash-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 24px;
      }
      .splash-sparkle {
        animation: splashPulse 1.6s ease-in-out infinite;
      }
      html[data-theme="light"] .splash-sparkle svg {
        filter: grayscale(1) brightness(0.35) contrast(1.2);
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1);    opacity: 0.85; }
        50%      { transform: scale(1.10); opacity: 1; }
      }
      .splash-title {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 32px;
        line-height: 1;
        letter-spacing: -0.02em;
        margin-top: 6px;
      }
      .splash-title em {
        font-style: italic;
        opacity: 0.5;
      }
      .splash-dots {
        display: flex;
        gap: 7px;
        margin-top: 6px;
      }
      .splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        animation: splashDot 1.2s ease-in-out infinite;
      }
      html[data-theme="light"] .splash-dots span {
        background: rgba(0, 0, 0, 0.50);
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.18s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes splashDot {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        50%      { opacity: 1;    transform: translateY(-3px); }
      }
      .splash-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.55;
        margin-top: 4px;
      }
    </style>
  </head>
  <body class="text-slate-100 antialiased">
    <div id="splash-screen" role="status" aria-live="polite" aria-label="Loading application">
      <div class="splash-content">
        <div class="splash-sparkle">
          <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="splash-grad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#e9d5ff" />
                <stop offset="50%" stop-color="#a78bfa" />
                <stop offset="100%" stop-color="#6d28d9" />
              </linearGradient>
            </defs>
            <rect x="3" y="3" width="26" height="26" rx="8" fill="url(#splash-grad)" opacity="0.22"/>
            <rect x="3.75" y="3.75" width="24.5" height="24.5" rx="7.25" stroke="url(#splash-grad)" stroke-width="1.5" opacity="0.9"/>
            <g opacity="0.55">
              <rect x="7" y="20" width="3" height="3" fill="#c4b5fd"/>
              <rect x="10" y="20" width="3" height="3" fill="#4c1d95"/>
              <rect x="13" y="20" width="3" height="3" fill="#c4b5fd"/>
              <rect x="7" y="23" width="3" height="3" fill="#4c1d95"/>
              <rect x="10" y="23" width="3" height="3" fill="#c4b5fd"/>
              <rect x="13" y="23" width="3" height="3" fill="#4c1d95"/>
            </g>
            <path
              d="M11 18.5c0-4.2 2.6-7.5 5.8-7.5 1.7 0 3.2.9 4.2 2.3.8-1 2-1.6 3.4-1.6 2.6 0 4.6 2.6 4.6 6.2 0 4.4-2.8 7.6-6.3 7.6-1.4 0-2.6-.5-3.6-1.3-.9.7-2 1.1-3.2 1.1-2.9 0-4.9-2.8-4.9-6.8z"
              fill="url(#splash-grad)"/>
            <path d="M22 6.2 L22.6 8.2 L24.6 8.8 L22.6 9.4 L22 11.4 L21.4 9.4 L19.4 8.8 L21.4 8.2 Z" fill="#e9d5ff"/>
          </svg>
        </div>
        <div class="splash-title"><em>My</em>Remover</div>
        <div class="splash-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="splash-label">Preparing app</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
