# Optional: ping HF Space so free tier wakes / stays warmer (cron).
# Does NOT guarantee true always-on — HF may still suspend free hardware.
#
# Enable: GitHub → Actions, after setting secrets:
#   HF_SPACE_URL = https://USERNAME-myremover.hf.space

name: Keep HF Space warm

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Space
        run: |
          set -e
          URL="${{ secrets.HF_SPACE_URL }}"
          if [ -z "$URL" ]; then
            echo "Set repository secret HF_SPACE_URL"
            exit 0
          fi
          curl -fsS -m 120 "$URL/" -o /dev/null || true
          curl -fsS -m 60 "$URL/gradio_api/info" -o /dev/null || true
          echo "Pinged $URL"
