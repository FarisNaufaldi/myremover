# Free Web Service — native Python (bukan Docker).
# Jika Render tetap minta kartu: itu verifikasi identitas ($1 hold),
# BUKAN bayar langganan. Atau pakai Replit (lihat PUBLIC.md).

services:
  - type: web
    name: myremover
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      set -e
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt
      cd frontend
      npm ci || npm install
      npm run build
      mkdir -p ../backend/static
      cp -r dist/* ../backend/static/
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ping
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: REMBG_MODEL
        value: u2netp
      - key: ALPHA_MATTING
        value: "false"
      - key: INFERENCE_DEVICE
        value: cpu
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: SKIP_MODEL_LOAD
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: MyRemoverChangeMe123
      - key: ADMIN_NAME
        value: Admin
